name: vpn

# Host networking: no NAT for QUIC/UDP, VLESS (tcp) and hysteria (udp) share :443.
# Root inside the container is only to bind ports < 1024; all other capabilities are dropped.
x-common: &common
  network_mode: host
  restart: unless-stopped
  user: "0:0"
  cap_drop: [ALL]
  cap_add: [NET_BIND_SERVICE]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  # VLESS REALITY on VLESS_PORT/tcp + Hysteria 2 on HYSTERIA_PORT/udp
  sing-box:
    <<: *common
    image: ${SINGBOX_IMAGE}
    command: ["run", "-c", "/etc/sing-box/config.json"]
    volumes:
      - ./generated/sing-box.json:/etc/sing-box/config.json:ro,z
      # hysteria uses caddy's certificate; sing-box reloads it when it changes
      - ./data/caddy:/caddy-data:ro,z

  # TLS certificate for DOMAIN (used by hysteria too) + subscription on DOMAIN:SUB_PORT.
  # Only on hubs: vpn.sh sets COMPOSE_PROFILES to ROLE.
  caddy:
    <<: *common
    profiles: [hub]
    image: ${CADDY_IMAGE}
    volumes:
      - ./generated/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./generated/sub:/srv:ro,z
      - ./data/caddy:/data:z
    healthcheck:
      test: ["CMD", "test", "-s", "/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.crt"]
      interval: 5s
      start_period: 3m
      retries: 3
