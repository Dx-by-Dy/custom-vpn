name: vpn

# Host networking: no NAT for QUIC/UDP, both services share :443 (xray tcp, hysteria udp).
# Root inside the container is only to bind ports < 1024; all other capabilities are dropped.
x-common: &common
  network_mode: host
  restart: unless-stopped
  user: "0:0"
  cap_drop: [ALL]
  cap_add: [NET_BIND_SERVICE]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  xray:
    <<: *common
    image: ${XRAY_IMAGE}
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./generated/xray.json:/etc/xray/config.json:ro,z

  hysteria:
    <<: *common
    image: ${HYSTERIA_IMAGE}
    command: ["server", "-c", "/etc/hysteria/config.yaml"]
    volumes:
      - ./generated/hysteria.yaml:/etc/hysteria/config.yaml:ro,z
      - ./data/hysteria-acme:/acme:z
