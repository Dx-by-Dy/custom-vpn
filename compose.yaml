name: vpn

# Host networking: no NAT for QUIC/UDP, both services share :443 (xray tcp, hysteria udp).
# Root inside the container is only to bind ports < 1024; all other capabilities are dropped.
x-common: &common
  network_mode: host
  restart: unless-stopped
  user: "0:0"
  cap_drop: [ALL]
  cap_add: [NET_BIND_SERVICE]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  xray:
    <<: *common
    image: ${XRAY_IMAGE}
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./generated/xray.json:/etc/xray/config.json:ro,z

  hysteria:
    <<: *common
    image: ${HYSTERIA_IMAGE}
    command: ["server", "-c", "/etc/hysteria/config.yaml"]
    environment:
      HYSTERIA_DISABLE_UPDATE_CHECK: "1" # version is pinned in .env
    depends_on:
      caddy:
        condition: service_healthy
    volumes:
      - ./generated/hysteria.yaml:/etc/hysteria/config.yaml:ro,z
      - ./data/caddy:/caddy-data:ro,z

  # TLS certificate for DOMAIN (used by hysteria too) + subscription on DOMAIN:SUB_PORT
  caddy:
    <<: *common
    image: ${CADDY_IMAGE}
    volumes:
      - ./generated/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./generated/sub:/srv:ro,z
      - ./data/caddy:/data:z
    healthcheck:
      test: ["CMD", "test", "-s", "/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.crt"]
      interval: 5s
      start_period: 3m
      retries: 3
